[project]
name = "home-media"
version = "0.1.0"
description = "Private Stash tag browser and resumable local GPU tagging worker"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "paramiko>=3.5,<5", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
home-media = "home_media.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["home_media", "observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
