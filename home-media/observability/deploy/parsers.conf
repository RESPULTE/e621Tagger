[PARSER]
    Name json_record
    Format json

[MULTILINE_PARSER]
    Name python_trace
    Type regex
    Flush_Timeout 5000
    Rule "start_state" "/^Traceback \(most recent call last\):/" "trace"
    Rule "trace" "/^(\s+.*|[A-Za-z_][A-Za-z0-9_.]*(Error|Exception|Interrupt):.*|During handling.*|The above exception.*)$/" "trace"
