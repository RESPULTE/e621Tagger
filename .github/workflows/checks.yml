name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check backend
      - run: python -m backend.export_schema
      - run: npm ci && npm run generate:api && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- backend/openapi.json frontend/src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t hydra-studio:check .
